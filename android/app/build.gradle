plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.notibridge.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.notibridge.app"   // se mantiene para poder actualizar sobre la app ya instalada
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // La clave de firma es PERSONAL y no se sube al repositorio (.gitignore).
    // Si existe, se firma con ella; si no, la release se firma con la clave debug.
    def ksFile = file('notibridge.keystore')
    if (ksFile.exists()) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword 'notibridge2026'
                keyAlias 'notibridge'
                keyPassword 'notibridge2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX base
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Material (drawer, tarjetas, switches)
    implementation 'com.google.android.material:material:1.11.0'

    // Corrutinas
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Base de datos local (Room)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Almacenamiento cifrado para la clave de emparejamiento
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // HTTP (envío al webhook)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Escáner de códigos QR
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
